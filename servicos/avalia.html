<!DOCTYPE html>
<html lang="pt-BR">

<head> <script>if (!localStorage.getItem('usuario')) {
      alert("Acesso negado! Faça o login para entrar");
      window.location.href = "../login/login.html";
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliações</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/avalia.css">
 

</head>

<body>
  <header>
    <a href="/index.html" class="return">
      <div class="logo">
        <h3>Assis Chateaubriand</h3>
        <p>Paraná, Brasil</p>
      </div>
    </a>

    <ul class="topicos">
      <li><a href="../index.html">Início</a></li>
      <li><a href="../mapa/index.html">Mapa</a></li>
      <li><a href="../servicos/index.html">Guia de Serviços</a></li>
      <li><a href="../historia/index.html">História</a></li>
    </ul>
    <div class="menu">
      <div class="centralizar">
        <img src="../imagens/menu.png" id="botaoMenu" alt="Menu">
        <a href="/login/login.html"><img src="../imagens/IUsuario.png" id="FotoUsuario" alt="Usuário"></a>
      </div>
      <div class="escondido">
        <section class="menuHeader">
          <h2>Configurações</h2>
          <button id="closeMenu"><img src="/imagens/imgFechar.png" alt="Fechar"></button>
        </section>

        <section class="menuMain">
          <div>
            <h3>Tema</h3>
            <div id="conteiner">
              <div id="bolinha"></div>
            </div>
          </div>
          <div class="acessibilidade">
            <h3>Acessibilidade</h3>

            <div class="PaiAcessibilidade">

              <h4>Tamanho do texto: <span id="textoFonte">100%</span></h4>

              <div id="controleTexto">
                <span>-A</span>
                <input type="range" id="alterarTexto" min="80" max="150" value="100" step="10">
                <span>A+</span>
              </div>

              <hr>
              <details class="menu-sanfona">
                <summary>Alterar a cor <span>▼</span></summary>

                <div id="botoesCores">
                  <button onclick="mudarCor('padrao')">Padrão</button>
                  <button onclick="mudarCor('escuro')">Modo Escuro</button>
                  <button onclick="mudarCor('contraste')">Alto Contraste</button>

                  <hr>
                  <p>Acessibilidade Visual (Daltonismo):</p>
                  <button onclick="mudarCor('tricromacia')">Tricromacia Anômala</button>
                  <button onclick="mudarCor('dicromacia')">Dicromacia (Azul/Amarelo)</button>
                  <button onclick="mudarCor('monocromacia')">Acromatopsia / Monocromacia</button>
                </div>
              </details>
            </div>
          </div>
          <div class="tradutor-container">
            <h3>Idioma / Language</h3>
            <div id="google_translate_element"></div>
          </div>
        </section>
        <section class="menuFooter">

        </section>

      </div>
    </div>
  </header>
  <main>
    <div id="pontoClick"></div>
    <div class="rating-input">
      <input type="radio" name="rating" value="5" id="star5"><label for="star5">★</label>
      <input type="radio" name="rating" value="4" id="star4"><label for="star4">★</label>
      <input type="radio" name="rating" value="3" id="star3"><label for="star3">★</label>
      <input type="radio" name="rating" value="2" id="star2"><label for="star2">★</label>
      <input type="radio" name="rating" value="1" id="star1"><label for="star1">★</label>
    </div>
  </main>
  <script src="../js/global.js"></script>
  <script src="../js/avalia.js"></script>
</body>

</html>
