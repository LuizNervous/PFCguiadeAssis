<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de Serviços</title>
   
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/servicos.css">
    <link rel="shortcut icon" href="../imagens/icon.png" type="image/x-icon">
</head>

<body>
    <div id="header">

    </div>

    <section class="info">
        <h1>Serviços</h1>
        <p>Tudo o que você precisa saber sobre os serviços da cidade</p>
    </section>

    <main>
        <section class="titulo">
            <h2>Guia Completo de Serviços</h2>
            <p>Encontre tudo o que você precisa na cidade</p>
            <input type="text" placeholder="Buscar serviços..." class="pesquisa">
        </section>


        <div class="filtros">
            <button class="ativo" data-categoria="todos">Todos</button>
            <button data-categoria="Mobilidade">Mobilidade</button>
            <button data-categoria="Turismo">Turismo</button>
            <button data-categoria="Gastronomia">Gastronomia</button>
            <button data-categoria="Farmacia">Farmácias</button>
            <button data-categoria="Posto de Saúde">Postos de Saúde</button>
            <button data-categoria="Hospital">Hospitais</button>
            <button data-categoria="Posto">Postos de Combustível</button>
        </div>


        <section class="cards" id="containerCards">

        </section>
    </main>


    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent">

        </div>
    </div>
    <div id="footer">

    </div>
    <button id="topBtn" title="Voltar ao topo">⬆</button>
    <script src="../js/global.js" defer></script>
    <script src="../js/servicos.js" defer></script>
    <script src="../js/header.js"></script>
    <script src="../componentes/componentes.js"></script>
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
     
        window.addEventListener('DOMContentLoaded', () => {
            new window.VLibras.Widget('https://vlibras.gov.br/app');
        });
    </script>

</body>

</html>
