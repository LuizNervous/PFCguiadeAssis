<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Guia Assis</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/login.css">
  <link rel="shortcut icon" href="../imagens/icone.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

  <div id="header"></div>

  <div class="overlay">
    <section class="login">

      <h1>Criar conta</h1>
      <p>Preencha seus dados para acessar o sistema</p>

      <form id="FormCadastro" novalidate>
        <section class="NomeIdade">
          <div class="input-grupo">
            <div class="input">
              <i class="fa-solid fa-user"></i>
              <input id="nome" type="text" placeholder="Nome Completo" autocomplete="name" required>
            </div>
            <small class="erro-campo" id="erro-nome"></small>
          </div>

          <div class="input-grupo">
            <div class="input">
              <i class="fa-solid fa-calendar-days"></i>
              <input id="data" type="date" aria-label="Data de nascimento" required>
            </div>
            <small class="erro-campo" id="erro-data"></small>
          </div>
        </section>

        <div class="input-grupo">
          <div class="input">
            <i class="fa-solid fa-envelope"></i>
            <input id="email" type="email" placeholder="E-mail (ex: nome@email.com)" autocomplete="email" required>
          </div>
          <small class="erro-campo" id="erro-email"></small>
        </div>

        <div class="input-grupo">
          <div class="input">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="senha" placeholder="Crie uma senha forte" autocomplete="new-password" required>
            <i class="fa-solid fa-eye toggle-senha" data-target="senha" tabindex="0" role="button" aria-label="Mostrar ou ocultar senha"></i>
          </div>

          <!-- Painel moderno de requisitos e força da senha -->
          <div class="painel-senha" id="painel-senha">
            <div class="forca-cabecalho">
              <span>Força da senha:</span>
              <strong id="texto-forca">Digite sua senha</strong>
            </div>
            <div class="barra-forca-container">
              <div class="barra-forca" id="barra-forca"></div>
            </div>

            <ul class="lista-requisitos">
              <li id="req-tamanho">
                <i class="fa-solid fa-circle-xmark"></i>
                <span>Mínimo de 6 caracteres</span>
              </li>
              <li id="req-maiuscula">
                <i class="fa-solid fa-circle-xmark"></i>
                <span>Pelo menos 1 letra maiúscula (A-Z)</span>
              </li>
              <li id="req-numero">
                <i class="fa-solid fa-circle-xmark"></i>
                <span>Pelo menos 1 número (0-9)</span>
              </li>
              <li id="req-especial">
                <i class="fa-solid fa-circle-xmark"></i>
                <span>Pelo menos 1 caractere especial (!@#$%...)</span>
              </li>
            </ul>
          </div>
        </div>

        <div class="input-grupo">
          <div class="input">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="confirmar-senha" placeholder="Confirmar senha" autocomplete="new-password" required>
            <i class="fa-solid fa-eye toggle-senha" data-target="confirmar-senha" tabindex="0" role="button" aria-label="Mostrar ou ocultar confirmação de senha"></i>
          </div>
          <small class="feedback-confirmacao" id="feedback-confirmacao"></small>
        </div>

        <button type="submit" id="cadastrar">
          Cadastrar
        </button>
      </form>

      <span>
        Já possui uma conta?
        <a href="login.html">Fazer login</a>
      </span>
    </section>
  </div>

  <div id="footer"></div>

  <script src="../js/global.js"></script>
  <script src="../js/cadastro.js"></script>
  <script src="../js/header.js"></script>
  <script src="../componentes/componentes.js"></script>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    });
  </script>
</body>
</html>
