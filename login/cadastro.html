<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Guia Assis</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/header.css">
    <link rel="shortcut icon" href="../imagens/icone.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

  <div id="header">

  </div>

  <div class="overlay">
    <section class="login">

      <h1>Criar conta</h1>
      <p>Preencha seus dados para acessar o sistema</p>
      <form id="FormCadastro">
        <section class="NomeIdade">
          <div class="input">
            <i class="fa-solid fa-user"></i>
            <input id="nome" type="text" placeholder="Nome Completo" required>
          </div>
          <div class="input">
            <i class="fa-solid fa-calendar-days"></i>
            <input id="data" type="date" required>
          </div>
        </section>

        <div class="input">
          <i class="fa-solid fa-envelope"></i>
          <input id="email" type="email" placeholder="E-mail" required>
        </div>
        <div class="input">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="senha" placeholder="Senha" required>
          <i class="fa-solid fa-eye" id="olho"></i>
        </div>
        <button type="submit">
          Cadastrar
        </button>
      </form>
      <span>
        Já possui uma conta?
        <a href="login.html">
          Fazer login
        </a>
      </span>
    </section>
  </div>
  <div id="footer">

  </div>

  <script src="../js/global.js"></script>
  <script src="../js/cadastro.js"></script>
  <script src="../js/header.js"></script>
  <script src="../componentes/componentes.js"></script>
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    });
  </script>

</body>

</html>
