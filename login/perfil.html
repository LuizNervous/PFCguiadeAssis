<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu perfil</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/perfil.css">
  <link rel="stylesheet" href="../css/header.css">
    <link rel="shortcut icon" href="../imagens/icone.png" type="image/x-icon">
</head>

<body>
  <div id="header">

  </div>
  <main>
    <section class="informacoes">

      <img src="/imagens/IUsuario.png" alt="">

      <h2>Meus dados : </h2>
      <div class="dados">
        <p><strong>Nome:</strong> <span id="nomeUsuario"></span></p>
        <p><strong>E-mail:</strong> <span id="emailUsuario"></span></p>
      </div>


    </section>
    <section class="mudancas">
      <h2>Editar meus dados</h2>
      <form id="formMudarDados">
        <div class="input">
          <input type="text" id="nomeEditar" placeholder="Nome completo" required>
        </div>
        <div class="input">
          <input type="email" id="emailEditar" placeholder="E-mail" required>
        </div>
        <button type="submit">Salvar alterações</button>
      </form>
      <button id="logOut">Sair</button>
    </section>
  </main>
  <div id="footer">

  </div>

  <script src="../js/global.js"></script>
  <script src="../js/header.js"></script>
  <script src="../componentes/componentes.js"></script>
  <script src="../js/perfil.js"></script>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    // O script aguarda o carregamento completo para executar sem erros
    window.addEventListener('DOMContentLoaded', () => {
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    });
  </script>

</body>

</html>
