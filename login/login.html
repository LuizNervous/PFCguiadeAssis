<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Assis Chateaubriand</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="shortcut icon" href="../imagens/icone.png" type="image/x-icon">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <div id="header">
    </div>
    <main>
        <section class="info">
            <div>
                <h2>Bem vindo</h2>
                <h1 id="nomeUsuario"></h1>
                <h2>para o <span>Guia Assis</span></h2>
            </div>
        </section>
        <section class="login">
            <h1>Login</h1>
            <p>Entre para continuar.</p>
            <form id="FormLogin">
                <div class="input">
                    <i class="fa-solid fa-user"></i>
                    <input id="email" type="email" placeholder="E-mail" required>
                </div>
                <div class="input">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="senha" placeholder="Senha" required>
                    <i class="fa-solid fa-eye" id="olho"></i>
                </div>
                <div class="extras">
                    <a href="recuperar-senha.html" id="link-esqueci">Esqueci minha senha</a>
                </div>
                <button type="submit" id="logar">Entrar</button>
            </form>
            <div class="divisor">
                <span>ou</span>
            </div>

            <div id="g_id_onload" data-client_id="507167128463-rsq9pg50v7igjsv462emtt3qj67smfe0.apps.googleusercontent.com" data-callback="handleCredentialResponse" data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large" data-logo_alignment="left">
            </div>

            <span>
                Ainda não possui conta?
                <a href="cadastro.html"> Criar conta</a>
            </span>
        </section>

    </main>

    <div id="footer"></div>

    <script src="../js/global.js"></script>
    <script src="../js/login.js"></script>
    <script src="../js/header.js"></script>
    <script src="../componentes/componentes.js"></script>
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            new window.VLibras.Widget('https://vlibras.gov.br/app');
        });
    </script>

</body>

</html>
