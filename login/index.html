<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Assis Chateaubriand</title>
       <script> if (localStorage.getItem("tema") === "Escuro") { document.documentElement.classList.add("Escuro"); } 
    </script>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/login.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

 <header>
        <a href="/index.html" class="return">
            <div class="logo">
                <h3>Assis Chateaubriand</h3>
                <p>Paraná, Brasil</p>
            </div>
        </a>

        <ul class="topicos">
            <li><a href="../index.html">Início</a></li>
            <li><a href="../mapa/index.html">Mapa</a></li>
            <li><a href="../servicos/index.html">Guia de Serviços</a></li>
            <li><a href="../historia/index.html">História</a></li>
            <li><a href="../login/index.html">Login</a></li>
        </ul>
        <div class="menu">
            <img src="/imagens/menu.png" id="botaoMenu" alt="Menu">

            <div class="escondido">
                <section class="menuHeader">
                    <h2>Configurações</h2>
                    <button id="closeMenu"><img src="/imagens/imgFechar.png" alt="Fechar"></button>
                </section>

                <section class="menuMain">
                    <div>
                        <h3>Tema</h3>
                        <div id="conteiner">
                            <div id="bolinha"></div>
                        </div>
                    </div>
                    <div>
                        <h3>Acessibilidade</h3>

                    </div>
                </section>
                <section class="menuFooter">

                </section>

            </div>
        </div>

    </header>

<div class="overlay">

<section class="login">

    <h1>Bem-vindo</h1>

    <p>Entre para continuar.</p>

    <form>

        <div class="input">

            <i class="fa-solid fa-user"></i>

            <input
            type="email"
            placeholder="E-mail"
            required>

        </div>

        <div class="input">

            <i class="fa-solid fa-lock"></i>

            <input
            type="password"
            id="senha"
            placeholder="Senha"
            required>

            <i
            class="fa-solid fa-eye"
            id="olho"></i>

        </div>

        <div class="extras">

            <label>

                <input type="checkbox">

                Lembrar de mim

            </label>

            <a href="#">Esqueci minha senha</a>

        </div>

        <button type="submit">

            Entrar

        </button>

    </form>

    <span>

        Ainda não possui conta?

        <a href="cadastro.html">

            Criar conta

        </a>

    </span>

</section>

</div>

<script src="/js/login.js"></script>
<script src="../js/global.js"></script>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>

</body>
</html>
