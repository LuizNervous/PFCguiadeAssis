<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Assis - Início</title>
  
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/header.css">

    <link rel="shortcut icon" href="imagens/icone.png" type="image/x-icon">

<body>
    <div id="header"></div>

    <main>

            <img src="imagens/Assis.png" alt="Assis Chateaubriand">

            <div class="overlay"></div>

            <div class="hero-texto">

                <h1>Assis Chateaubriand</h1>

                <p>

                </p>

    <div id="footer">

    <button id="topBtn" title="Voltar ao topo">⬆</button>
    <script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>
    <script src="https://files.bpcontent.cloud/2026/05/26/01/20260526014518-SB2V4VCJ.js" defer></script>

    <script src="/js/header.js"></script>
    <script src="/componentes/componentes.js"></script>
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

        });
