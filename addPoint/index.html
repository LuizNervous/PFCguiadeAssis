<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Painel Administrativo - Guia Assis</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="shortcut icon" href="../imagens/icone.png" type="image/x-icon">
</head>

<body>
  <div id="header"></div>

  <main>
    <section class="adm-topo">
      <h1>Painel Administrativo</h1>
      <p>Gerencie os pontos do Guia Assis</p>
    </section>

    <p id="admVerificando" class="adm-status" role="status">Verificando permissões…</p>

    <div id="admPainel" class="adm-layout" hidden>
      <nav class="adm-nav" aria-label="Seções do painel">
        <button type="button" data-secao="geral" class="ativo" aria-current="page">Visão geral</button>
        <button type="button" data-secao="pontos">Pontos</button>
        <button type="button" data-secao="imagens">Imagens</button>
      </nav>

      <div class="adm-conteudo">
        <section id="sec-geral" class="adm-secao">
          <h2>Visão geral</h2>
          <div id="admResumo" class="adm-cards"></div>
        </section>

        <section id="sec-pontos" class="adm-secao" hidden>
          <div class="adm-cabecalho">
            <h2>Pontos</h2>
            <button type="button" id="admNovo" class="adm-btn adm-btn-principal">+ Novo ponto</button>
          </div>
          <div class="adm-filtros">
            <label class="adm-so-leitor" for="admBusca">Buscar pontos</label>
            <input type="search" id="admBusca" placeholder="Buscar por nome, endereço ou categoria…">
            <label class="adm-so-leitor" for="admFiltroCategoria">Filtrar por categoria</label>
            <select id="admFiltroCategoria"><option value="">Todas as categorias</option></select>
          </div>
          <p id="admContagem" class="adm-suave" role="status"></p>
          <div id="admTabela"></div>
        </section>

        <section id="sec-imagens" class="adm-secao" hidden>
          <h2>Imagens</h2>
          <div id="admImagens" class="adm-galeria"></div>
        </section>
      </div>
    </div>

    <dialog id="admDialogoPonto" class="adm-dialogo" aria-labelledby="admTituloForm">
      <form id="admForm" novalidate>
        <h2 id="admTituloForm">Novo ponto</h2>
        <input type="hidden" id="admId">

        <div class="adm-campo">
          <label for="admNome">Nome</label>
          <input type="text" id="admNome" maxlength="100" required>
        </div>
        <div class="adm-campo">
          <label for="admCategoria">Categoria</label>
          <select id="admCategoria" required><option value="">Selecione…</option></select>
        </div>
        <div class="adm-campo">
          <label for="admEndereco">Endereço</label>
          <input type="text" id="admEndereco" maxlength="255" required>
        </div>
        <div class="adm-campo">
          <label for="admDescricao">Descrição</label>
          <textarea id="admDescricao" rows="4" maxlength="1000" required></textarea>
        </div>
        <div class="adm-linha-campos">
          <div class="adm-campo">
            <label for="admLatitude">Latitude</label>
            <input type="number" id="admLatitude" step="any" min="-90" max="90" required>
          </div>
          <div class="adm-campo">
            <label for="admLongitude">Longitude</label>
            <input type="number" id="admLongitude" step="any" min="-180" max="180" required>
          </div>
        </div>
        <div class="adm-campo">
          <label for="admImagem">Imagem</label>
          <input type="file" id="admImagem" accept="image/jpeg,image/png,image/webp" aria-describedby="admImagemDica">
          <small id="admImagemDica"></small>
          <figure class="adm-previa">
            <img id="admPreview" alt="Pré-visualização da imagem do ponto" hidden>
            <figcaption id="admLegendaPreview"></figcaption>
          </figure>
        </div>

        <p id="admErroForm" class="adm-erro" role="alert" hidden></p>
        <div class="adm-acoes">
          <button type="button" id="admCancelar" class="adm-btn">Cancelar</button>
          <button type="submit" id="admSalvar" class="adm-btn adm-btn-principal">Salvar</button>
        </div>
      </form>
    </dialog>

    <dialog id="admDialogoExcluir" class="adm-dialogo" aria-labelledby="admTituloExcluir">
      <h2 id="admTituloExcluir">Excluir ponto?</h2>
      <p>Você vai excluir <strong id="admNomeExcluir"></strong>, com a imagem e todas as avaliações. Esta ação não pode ser desfeita.</p>
      <div class="adm-acoes">
        <button type="button" id="admCancelarExcluir" class="adm-btn">Cancelar</button>
        <button type="button" id="admConfirmarExcluir" class="adm-btn adm-btn-perigo">Excluir</button>
      </div>
    </dialog>
  </main>

  <div id="footer"></div>

  <script src="../js/global.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/header.js"></script>
  <script src="../componentes/componentes.js"></script>
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    });
  </script>
</body>

</html>
