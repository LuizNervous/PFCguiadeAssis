<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Painel Administrativo - Guia Assis</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="shortcut icon" href="../imagens/icone.png" type="image/x-icon">
</head>

<body>
  <div id="header"></div>

  <main>
    <section class="adm-topo">
      <h1>Painel Administrativo</h1>
      <p>Gerencie os pontos do Guia Assis</p>
    </section>

    <p id="admVerificando" class="adm-status" role="status">Verificando permissões…</p>

    <div id="admPainel" class="adm-layout" hidden>
      <nav class="adm-nav" aria-label="Seções do painel">
        <button type="button" data-secao="geral" class="ativo" aria-current="page">Visão geral</button>
        <button type="button" data-secao="pontos">Pontos</button>
        <button type="button" data-secao="imagens">Imagens</button>
      </nav>

      <div class="adm-conteudo">
        <section id="sec-geral" class="adm-secao">
          <h2>Visão geral</h2>
          <div id="admResumo" class="adm-cards"></div>
        </section>

        <section id="sec-pontos" class="adm-secao" hidden>
          <h2>Pontos</h2>
          <div id="admTabela"></div>
        </section>

        <section id="sec-imagens" class="adm-secao" hidden>
          <h2>Imagens</h2>
          <div id="admImagens" class="adm-galeria"></div>
        </section>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="../js/global.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/header.js"></script>
  <script src="../componentes/componentes.js"></script>
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    });
  </script>
</body>

</html>
