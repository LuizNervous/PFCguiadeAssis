<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interativo de Assis Chateaubriand | Guia Assis</title>
    <meta name="description" content="Explore o mapa interativo de Assis Chateaubriand (PR) com filtros por categoria: gastronomia, farmácias, hospitais, postos, praças e pontos turísticos.">
    <link rel="canonical" href="https://site-guia-assis.vercel.app/mapa/index.html">
    <meta property="og:title" content="Mapa Interativo de Assis Chateaubriand | Guia Assis">
    <meta property="og:description" content="Descubra pontos turísticos, gastronomia, farmácias, hospitais e serviços no mapa de Assis Chateaubriand.">
    <meta property="og:url" content="https://site-guia-assis.vercel.app/mapa/index.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:image" content="https://site-guia-assis.vercel.app/imagens/Assis.png">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="../css/mapa.css">
    <link rel="shortcut icon" href="../imagens/icone.png" type="image/x-icon">
</head>

<body>

    <div id="header"></div>

    <section class="mapa-hero" aria-label="Cabeçalho do mapa">
        <div class="mapa-hero-inner">
            <div class="mapa-hero-texto">
                <span class="mapa-coord-pill">
                    <span class="mapa-pulse-dot" aria-hidden="true"></span>
                    <span>24°25'S · 53°31'O · Assis Chateaubriand, PR</span>
                </span>
                <h1>Mapa Interativo</h1>
                <p>Explore locais, serviços e rotas da cidade em tempo real</p>
            </div>
            <div class="mapa-hero-metrica" id="mapaResumoTotal" aria-live="polite">
                <span class="mapa-metrica-valor" id="mapaTotalLocais">—</span>
                <span class="mapa-metrica-rotulo">locais mapeados</span>
            </div>
        </div>
    </section>

    <main class="mapa-workspace" id="mapaWorkspace">
        <aside class="mapa-painel" aria-label="Explorar locais">
            <div class="mapa-cat-deck" id="mapaCategorias" role="tablist" aria-label="Categorias do mapa"></div>

            <div class="mapa-barra-lista">
                <p class="mapa-contagem" id="mapaContagem" role="status">Carregando locais…</p>
                <div class="mapa-ordenar-wrap">
                    <label class="mapa-sr-only" for="mapaOrdenar">Ordenar locais</label>
                    <select id="mapaOrdenar" class="mapa-select-ordenar">
                        <option value="relevancia">Relevância</option>
                        <option value="nota">Melhor nota</option>
                        <option value="nome">Nome (A–Z)</option>
                        <option value="distancia" hidden disabled>Mais perto</option>
                    </select>
                </div>
            </div>

            <div class="mapa-lista" id="informacoes" role="region" aria-label="Lista de locais filtrados"></div>

            <div class="mapa-carregar-mais" id="mapaCarregarMaisWrap" hidden>
                <button type="button" id="btnCarregarMais" class="mapa-btn-mais">Mostrar mais locais</button>
            </div>
        </aside>

        <section class="mapa-palco" aria-label="Mapa interativo de Assis Chateaubriand">
            <div class="mapa-hud-busca">
                <svg class="mapa-hud-icone" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                </svg>
                <label class="mapa-sr-only" for="mapaBusca">Buscar local, rua, bairro ou tag</label>
                <input type="search" id="mapaBusca" placeholder="Buscar local, rua ou tag…" autocomplete="off">
                <kbd class="mapa-atalho" id="mapaAtalhoTecla" aria-hidden="true">/</kbd>
                <button type="button" id="btnLimparBusca" class="mapa-btn-limpar" hidden aria-label="Limpar busca">×</button>
                <span class="mapa-hud-badge" id="mapaBadgeContagem" aria-live="polite">0 no mapa</span>
            </div>

            <div class="mapa-hud-controles" role="group" aria-label="Controles do mapa">
                <button type="button" id="btnPertoDeMim" class="mapa-hud-ctrl" title="Usar minha localização para ordenar por distância" aria-label="Perto de mim">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 2v3"></path>
                        <path d="M12 19v3"></path>
                        <path d="M2 12h3"></path>
                        <path d="M19 12h3"></path>
                        <circle cx="12" cy="12" r="7"></circle>
                    </svg>
                    <span class="mapa-ctrl-texto">Perto de mim</span>
                </button>
                <button type="button" id="btnEnquadrar" class="mapa-hud-ctrl" title="Enquadrar todos os pontos filtrados" aria-label="Enquadrar resultados">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M15 3h6v6"></path>
                        <path d="M9 21H3v-6"></path>
                        <path d="M21 3l-7 7"></path>
                        <path d="M3 21l7-7"></path>
                    </svg>
                </button>
                <button type="button" id="btnCentralizar" class="mapa-hud-ctrl" title="Centralizar em Assis Chateaubriand" aria-label="Centralizar em Assis Chateaubriand">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </button>
            </div>

            <div class="mapa-hud-status" id="mapaStatusChip" aria-live="polite">
                <span class="mapa-status-ponto" aria-hidden="true"></span>
                <span id="mapaStatusTexto">Todos os locais</span>
            </div>

            <div id="mapa"></div>
        </section>
    </main>

    <div id="footer"></div>
    <button id="topBtn" title="Voltar ao topo">⬆</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/favoritos.js"></script>
    <script src="../js/mapa.js"></script>
    <script src="../js/header.js"></script>
    <script src="../componentes/componentes.js"></script>
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            new window.VLibras.Widget('https://vlibras.gov.br/app');
        });
    </script>

</body>

</html>
