<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interativo de Assis Chateaubriand | Guia Assis</title>
    <meta name="description" content="Explore o mapa interativo de Assis Chateaubriand (PR) com filtros por categoria: gastronomia, farmácias, hospitais, postos, praças e pontos turísticos.">
    <link rel="canonical" href="https://site-guia-assis.vercel.app/mapa/index.html">
    <meta property="og:title" content="Mapa Interativo de Assis Chateaubriand | Guia Assis">
    <meta property="og:description" content="Descubra pontos turísticos, gastronomia, farmácias, hospitais e serviços no mapa de Assis Chateaubriand.">
    <meta property="og:url" content="https://site-guia-assis.vercel.app/mapa/index.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:image" content="https://site-guia-assis.vercel.app/imagens/Assis.png">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/mapa.css">
    <link rel="shortcut icon" href="../imagens/icone.png" type="image/x-icon">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>

    <div id="header"></div>

    <div class="info">
        <h1>Explore o Mapa</h1> <br>
        <p>Descubra todos os pontos da cidade</p>

    </div>

    <br><br>
    <main>
        <div class="container-mapa">

            <div class="painel-filtros">
                <h3>Veja as categorias abaixo</h3>
                <hr>
                <button class="btn-filtro ativo" data-categoria="mobilidade">🚌 Mobilidade</button>
                <button class="btn-filtro" data-categoria="turismo">📸 Turismo</button>
                <button class="btn-filtro" data-categoria="gastronomia">🍴 Gastronomia</button>
                <button class="btn-filtro" data-categoria="posto">⛽ Postos</button>
                <button class="btn-filtro" data-categoria="farmacia">💊 Farmacias</button>
                <button class="btn-filtro" data-categoria="posto de saúde">🏥 Postos de Saúde</button>
                <button class="btn-filtro" data-categoria="hospital">🏨 Hospitais</button>
            </div>

            <div id="mapa"></div>

        </div>
        <section id="informacoes">

        </section>
    </main>
    <div id="footer"></div>
    <button id="topBtn" title="Voltar ao topo">⬆</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/mapa.js"></script>
    <script src="../js/header.js"></script>
    <script src="../componentes/componentes.js"></script>
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        // O script aguarda o carregamento completo para executar sem erros
        window.addEventListener('DOMContentLoaded', () => {
            new window.VLibras.Widget('https://vlibras.gov.br/app');
        });
    </script>

</body>

</html>
